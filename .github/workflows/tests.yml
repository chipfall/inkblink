name: tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Host tests (stand-in libraries, JavaScript, version check)
        run: make -C tests test
      - name: Driver-dependent tests (real e-paper driver files)
        run: make -C tests test-driver
